name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Compilar APK release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Análisis estático (debe pasar sin problemas)
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze_output.txt

      - name: Publicar diagnóstico (si el analyze falla)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('analyze_output.txt', 'utf8'); } catch (e) {}
            if (!out) out = '(sin output del analyze)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] flutter analyze falló — ${context.sha.slice(0,7)}`,
              body: 'Salida completa de `flutter analyze`:\n\n```\n' + out.slice(-8000) + '\n```'
            });

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Nombrar artefacto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "activation-v${VERSION}.apk"
          ls -lh "activation-v${VERSION}.apk"

      - name: Crear Release con el APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "activation-v*.apk"
          body: |
            ## Activation v1.1.0 — Correcciones de estabilidad ⚡

            App móvil para descubrir a tiempo becas, hackathons, gaming,
            empleo y ciencia en Perú — con alertas antes de cada deadline.

            ### Novedades de esta versión
            - CORREGIDO: el botón final del onboarding no avanzaba a la app
            - CORREGIDO: la app volvía a mostrar el onboarding en cada reinicio
            - CORREGIDO: apertura de enlaces externos ("Postular en sitio oficial")
              en Android 11+
            - Recordatorios programados ahora en hora de Perú (America/Lima)
            - Pantalla de detalle más robusta ante convocatorias retiradas

            ### Instalación
            1. Descarga `activation-v1.1.0.apk` (abajo).
            2. Habilita "Instalar apps de fuentes desconocidas" en tu Android.
            3. Instala y activa las notificaciones al finalizar el onboarding.

            ### Requisitos
            - Android 7.0 (API 24) o superior
            - arm64-v8a

      - name: Subir artefacto (runs sin tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: activation-apk
          path: "activation-v*.apk"
